name: Build NetHunter flo BT400

on:
  push:
    branches:
      - nethunter-bt400
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc flex bison libncurses-dev cpio python3 wget libmpc3 libgmp10
          wget -q https://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb -O /tmp/libmpfr4.deb
          sudo dpkg -i /tmp/libmpfr4.deb

      - name: Clone NetHunter flo cm-13.0 kernel
        run: |
          git clone --depth 1 --branch cm-13.0 https://github.com/jcadduono/nethunter_kernel_flo.git kernel

      - name: Patch BT400 and BlueZ MGMT compatibility
        run: |
          python3 .github/scripts/patch_bt400_mgmt.py
          sed -i -E 's/^static int (remove_key|disconnect|get_connections|pin_code_reply|pin_code_neg_reply)\(/static int __attribute__((unused)) \1(/' kernel/net/bluetooth/mgmt.c
          grep -n -E '__attribute__\(\(unused\)\).*remove_key|__attribute__\(\(unused\)\).*disconnect|__attribute__\(\(unused\)\).*get_connections|__attribute__\(\(unused\)\).*pin_code' kernel/net/bluetooth/mgmt.c || true

      - name: Patch BlueZ 5.66 discovery bridge
        run: |
          python3 .github/scripts/patch_bt400_discovery.py
          grep -n -E 'MGMT_OP_START_DISCOVERY|MGMT_OP_STOP_DISCOVERY|compat_discovery_type|compat_mgmt_discovering' kernel/net/bluetooth/mgmt.c | head -n 80
          grep -n -E 'MGMT_OP_START_DISCOVERY|MGMT_OP_STOP_DISCOVERY|MGMT_OP_UNSET_RSSI_REPORTER|MGMT_OP_CANCEL_RESOLVE_NAME' kernel/include/net/bluetooth/mgmt.h

      - name: Make legacy gcc-wrapper work with Python 3
        run: |
          python3 -m lib2to3 -w kernel/scripts/gcc-wrapper.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/scripts/gcc-wrapper.py')
          s = p.read_text()
          s = s.replace('#! /usr/bin/env python', '#!/usr/bin/env python3', 1)
          s = s.replace('subprocess.Popen(args, stderr=subprocess.PIPE)',
                        'subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)')
          p.write_text(s)
          PY
          python3 -m py_compile kernel/scripts/gcc-wrapper.py

      - name: Clone Android GCC 4.9 toolchain
        run: |
          git clone --depth 1 --branch mm-6.0 https://github.com/Evervolv/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9.git toolchain
          ./toolchain/bin/arm-eabi-gcc --version
          ldd ./toolchain/libexec/gcc/arm-eabi/4.9.4/cc1 || true

      - name: Build flo kernel
        working-directory: kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-"
          mkdir -p build
          make O=build nethunter_flo_defconfig
          make O=build -j2 zImage

      - name: Prepare artifacts
        run: |
          mkdir -p artifact
          cp kernel/build/arch/arm/boot/zImage artifact/zImage-nethunter-flo-bt400-mgmtdiscovery
          cp kernel/build/.config artifact/nethunter-flo-bt400-mgmtdiscovery.config
          cp kernel/build/System.map artifact/System.map-nethunter-flo-bt400-mgmtdiscovery
          cp kernel/build/vmlinux artifact/vmlinux-nethunter-flo-bt400-mgmtdiscovery
          sha256sum artifact/* | tee artifact/SHA256SUMS.txt
          ls -lh artifact

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-flo-bt400-mgmtdiscovery-kernel
          path: artifact/
          if-no-files-found: error
          retention-days: 30
