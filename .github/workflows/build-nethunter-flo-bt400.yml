name: Build NetHunter flo BT400

on:
  push:
    branches:
      - nethunter-bt400
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc flex bison libncurses-dev cpio python3 wget libmpc3 libgmp10
          wget -q https://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb -O /tmp/libmpfr4.deb
          sudo dpkg -i /tmp/libmpfr4.deb

      - name: Clone NetHunter flo cm-13.0 kernel
        run: |
          git clone --depth 1 --branch cm-13.0 https://github.com/jcadduono/nethunter_kernel_flo.git kernel

      - name: Patch btusb for ASUS USB-BT400 0b05:17cb
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/drivers/bluetooth/btusb.c')
          s = p.read_text()
          if 'USB_DEVICE(0x0b05, 0x17cb)' in s:
              print('USB-BT400 ID already present')
          else:
              needle = '\t{ USB_DEVICE(0x0a5c, 0x21e1) },\n'
              repl = needle + '\n\t/* ASUS USB-BT400 - Broadcom BCM20702A0.\n\t * Old flo Android USB core returns -EINVAL while btusb claims\n\t * the secondary SCO/isoc interface, so keep HCI command/ACL\n\t * transport and skip the optional isochronous interface. */\n\t{ USB_DEVICE(0x0b05, 0x17cb), .driver_info = BTUSB_BROKEN_ISOC },\n'
              if needle not in s:
                  raise SystemExit('Patch anchor not found')
              p.write_text(s.replace(needle, repl, 1))
          PY
          grep -n -A8 -B2 '0x17cb' kernel/drivers/bluetooth/btusb.c

      - name: Make legacy gcc-wrapper work with Python 3
        run: |
          python3 -m lib2to3 -w kernel/scripts/gcc-wrapper.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/scripts/gcc-wrapper.py')
          s = p.read_text()
          s = s.replace('#! /usr/bin/env python', '#!/usr/bin/env python3', 1)
          s = s.replace('subprocess.Popen(args, stderr=subprocess.PIPE)',
                        'subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)')
          p.write_text(s)
          PY
          python3 -m py_compile kernel/scripts/gcc-wrapper.py

      - name: Clone Android GCC 4.9 toolchain
        run: |
          git clone --depth 1 --branch mm-6.0 https://github.com/Evervolv/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9.git toolchain
          ./toolchain/bin/arm-eabi-gcc --version
          ldd ./toolchain/libexec/gcc/arm-eabi/4.9.4/cc1 || true

      - name: Build flo kernel
        working-directory: kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-"
          mkdir -p build
          make O=build nethunter_flo_defconfig
          make O=build -j2 zImage

      - name: Prepare artifacts
        run: |
          mkdir -p artifact
          cp kernel/build/arch/arm/boot/zImage artifact/zImage-nethunter-flo-bt400-noisoc
          cp kernel/build/.config artifact/nethunter-flo-bt400-noisoc.config
          cp kernel/build/System.map artifact/System.map-nethunter-flo-bt400-noisoc
          sha256sum artifact/* | tee artifact/SHA256SUMS.txt
          ls -lh artifact

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-flo-bt400-noisoc-kernel
          path: artifact/
          if-no-files-found: error
          retention-days: 30
