name: Build NetHunter flo BT400

on:
  push:
    branches:
      - nethunter-bt400
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential bc flex bison libncurses-dev cpio python3 wget libmpc3 libgmp10
          wget -q https://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb -O /tmp/libmpfr4.deb
          sudo dpkg -i /tmp/libmpfr4.deb

      - name: Clone NetHunter flo cm-13.0 kernel
        run: |
          git clone --depth 1 --branch cm-13.0 https://github.com/jcadduono/nethunter_kernel_flo.git kernel

      - name: Patch btusb for ASUS USB-BT400 and old flo HCI driver-data ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/drivers/bluetooth/btusb.c')
          s = p.read_text()

          if 'USB_DEVICE(0x0b05, 0x17cb)' not in s:
              needle = '\t{ USB_DEVICE(0x0a5c, 0x21e1) },\n'
              repl = needle + '\n\t/* ASUS USB-BT400 - Broadcom BCM20702A0. */\n\t{ USB_DEVICE(0x0b05, 0x17cb), .driver_info = BTUSB_BROKEN_ISOC },\n'
              if needle not in s:
                  raise SystemExit('BT400 ID patch anchor not found')
              s = s.replace(needle, repl, 1)

          # Old Qualcomm HCI core requires ->destruct. Keep it no-op because
          # btusb_disconnect() already owns/free()s the btusb private data.
          if 'static void btusb_compat_destruct(struct hci_dev *hdev)' not in s:
              needle = 'static struct usb_driver btusb_driver;\n'
              repl = needle + '\n/* Compatibility shim for the older flo HCI core. */\nstatic void btusb_compat_destruct(struct hci_dev *hdev)\n{\n}\n'
              if needle not in s:
                  raise SystemExit('btusb_driver declaration anchor not found')
              s = s.replace(needle, repl, 1)

          if 'hdev->destruct = btusb_compat_destruct;' not in s:
              needle = '\thdev->notify   = btusb_notify;\n'
              repl = needle + '\thdev->destruct = btusb_compat_destruct;\n\thdev->owner    = THIS_MODULE;\n'
              if needle not in s:
                  raise SystemExit('HCI callback patch anchor not found')
              s = s.replace(needle, repl, 1)

          # Critical ABI fix: this flo tree has struct hci_dev::driver_data,
          # but hci_get/set_drvdata() use hdev->dev drvdata. hci_register_sysfs()
          # later overwrites that dev drvdata with hdev itself. Keep btusb
          # private state in the legacy hdev->driver_data field instead.
          s = s.replace('hci_get_drvdata(hdev)', 'hdev->driver_data')
          s = s.replace('hci_set_drvdata(hdev, data);', 'hdev->driver_data = data;')

          p.write_text(s)
          PY
          grep -n -A5 -B2 '0x17cb' kernel/drivers/bluetooth/btusb.c
          grep -n -A8 -B4 'btusb_compat_destruct' kernel/drivers/bluetooth/btusb.c
          grep -n 'driver_data' kernel/drivers/bluetooth/btusb.c | head -n 30
          if grep -q 'hci_get_drvdata(hdev)' kernel/drivers/bluetooth/btusb.c; then
            echo 'ERROR: unpatched hci_get_drvdata remains in btusb.c'
            exit 1
          fi

      - name: Add modern BlueZ management-channel compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/net/bluetooth/hci_sock.c')
          s = p.read_text()

          # This Android/Qualcomm 3.4 tree uses the old ABI:
          #   RAW=0, CONTROL=1
          # Modern BlueZ (including 5.66 in the NetHunter chroot) uses:
          #   RAW=0, USER=1, MONITOR=2, CONTROL=3
          # Translate modern CONTROL channel 3 to this kernel's legacy
          # internal CONTROL channel 1, preserving compatibility with both.
          old = '''\tif (haddr.hci_channel > HCI_CHANNEL_CONTROL)\n\t\treturn -EINVAL;\n\n\tif (haddr.hci_channel == HCI_CHANNEL_CONTROL && !enable_mgmt)\n\t\treturn -EINVAL;\n'''
          new = '''\t/* Accept modern BlueZ HCI_CHANNEL_CONTROL (3) and map it to\n\t * this legacy Android kernel's HCI_CHANNEL_CONTROL (1). */\n\tif (haddr.hci_channel == 3)\n\t\thaddr.hci_channel = HCI_CHANNEL_CONTROL;\n\telse if (haddr.hci_channel > HCI_CHANNEL_CONTROL)\n\t\treturn -EINVAL;\n\n\tif (haddr.hci_channel == HCI_CHANNEL_CONTROL && !enable_mgmt)\n\t\treturn -EINVAL;\n'''
          if old not in s:
              raise SystemExit('HCI management-channel patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -n -A14 -B5 'modern BlueZ HCI_CHANNEL_CONTROL' kernel/net/bluetooth/hci_sock.c

      - name: Make legacy gcc-wrapper work with Python 3
        run: |
          python3 -m lib2to3 -w kernel/scripts/gcc-wrapper.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel/scripts/gcc-wrapper.py')
          s = p.read_text()
          s = s.replace('#! /usr/bin/env python', '#!/usr/bin/env python3', 1)
          s = s.replace('subprocess.Popen(args, stderr=subprocess.PIPE)',
                        'subprocess.Popen(args, stderr=subprocess.PIPE, universal_newlines=True)')
          p.write_text(s)
          PY
          python3 -m py_compile kernel/scripts/gcc-wrapper.py

      - name: Clone Android GCC 4.9 toolchain
        run: |
          git clone --depth 1 --branch mm-6.0 https://github.com/Evervolv/android_prebuilts_gcc_linux-x86_arm_arm-eabi-4.9.git toolchain
          ./toolchain/bin/arm-eabi-gcc --version
          ldd ./toolchain/libexec/gcc/arm-eabi/4.9.4/cc1 || true

      - name: Build flo kernel
        working-directory: kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/arm-eabi-"
          mkdir -p build
          make O=build nethunter_flo_defconfig
          make O=build -j2 zImage

      - name: Prepare artifacts
        run: |
          mkdir -p artifact
          cp kernel/build/arch/arm/boot/zImage artifact/zImage-nethunter-flo-bt400-mgmtcompat
          cp kernel/build/.config artifact/nethunter-flo-bt400-mgmtcompat.config
          cp kernel/build/System.map artifact/System.map-nethunter-flo-bt400-mgmtcompat
          cp kernel/build/vmlinux artifact/vmlinux-nethunter-flo-bt400-mgmtcompat
          sha256sum artifact/* | tee artifact/SHA256SUMS.txt
          ls -lh artifact

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-flo-bt400-mgmtcompat-kernel
          path: artifact/
          if-no-files-found: error
          retention-days: 30
